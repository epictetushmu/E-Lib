# Production stack: `docker compose up -d --build`.
# Local development layers docker-compose.dev.yml on top (bind-mounted code, debug, a throwaway
# MongoDB) — set COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml in your local .env.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: e-lib-app
    container_name: elib-app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      # Mounted rather than passed via env_file: compose would try to interpolate the
      # ${MONGO_PASSWORD} placeholder inside MONGO_URI, which App\Includes\Environment resolves itself.
      # The file must exist before `up` — otherwise Docker creates an empty directory named .env.
      - ./.env:/var/www/html/.env:ro
      # Uploaded books and thumbnails must outlive image rebuilds. A named volume (not a host bind)
      # so the first start seeds it with the placeholder thumbnails baked into the image.
      - uploads:/var/www/html/public/assets/uploads
      - logs:/var/www/html/storage/logs
    networks:
      - elib-network

  # Content search ("search inside books") runs in the next two services, which only start when the
  # "search" profile is on: COMPOSE_PROFILES=search in .env (production should set it). The app reads
  # the same variable: off, the "Inside books" search is hidden and its API answers 404.

  # Content-search indexing (scripts/index-worker.php): the app image running a loop instead of Apache.
  # No container_name, so it can scale: `docker compose up -d --scale worker=4`.
  worker:
    profiles: ["search"]
    build:
      context: .
      dockerfile: Dockerfile
    image: e-lib-app
    command: ["php", "scripts/index-worker.php"]
    restart: unless-stopped
    environment:
      - APP_ENV=production
    volumes:
      - ./.env:/var/www/html/.env:ro
      - uploads:/var/www/html/public/assets/uploads
    depends_on:
      embedder:
        condition: service_healthy
    # Lets the worker finish its current batch on redeploy; if killed anyway, its lease lapses
    # and the book resumes from the last stored batch.
    stop_grace_period: 60s
    networks:
      - elib-network

  # Hourly overdue-loan notices (scripts/notify-overdue.php). Each loan is notified once, so a restart
  # or a missed hour is harmless.
  scheduler:
    image: e-lib-app
    command: ["sh", "-c", "while true; do php scripts/notify-overdue.php; sleep 3600; done"]
    restart: unless-stopped
    environment:
      - APP_ENV=production
    volumes:
      - ./.env:/var/www/html/.env:ro
    depends_on:
      - app
    networks:
      - elib-network

  # Self-hosted embedding model: bge-m3 (Greek + English, 1024 dims) served by Ollama at f16 — ~2GB RAM,
  # where text-embeddings-inference's fp32 build of the same model needed 5-6GB for identical vectors.
  # Deliberately NO ports: Ollama has no authentication, so only app + worker reach it, by service name.
  embedder:
    profiles: ["search"]
    image: ollama/ollama:0.40.2
    # Ollama doesn't pull models by itself: start the server, pull the model (a no-op once it's in the
    # volume), then keep serving. The tag is EMBEDDING_MODEL — keep the two in sync; changing it makes
    # the worker re-embed every book. bge-m3:567m = model ID 790764642607.
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull bge-m3:567m && wait"]
    restart: unless-stopped
    environment:
      # Keep the model loaded: Ollama unloads idle models after 5 minutes by default, and reloading it
      # would blow the search request's EMBEDDING_TIMEOUT (searches would fall back to keyword-only).
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      # The 1.2GB model downloads on first start and is kept across restarts/redeploys.
      - embedder-models:/root/.ollama
    mem_limit: 3g
    healthcheck:
      # Healthy once the model is pulled (the image has no curl).
      test: ["CMD", "ollama", "show", "bge-m3:567m"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m
    networks:
      - elib-network

  caddy:
    image: caddy:2-alpine
    container_name: elib-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - app
    networks:
      - elib-network

networks:
  elib-network:
    driver: bridge

volumes:
  uploads:
  logs:
  embedder-models:
  caddy-data:
  caddy-config:
