name: E-Lib CI

on: [push, pull_request]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mbstring, mongodb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # public/dist/index.html must exist before the PHP server starts — PageRouter
      # serves it as the SPA shell for every non-API, non-/cas-login request.
      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Create .env for smoke test
        run: |
          cat > .env << 'EOL'
          APP_ENV=development
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          API_BASE_URL=http://localhost:8000/
          MONGO_URI=mongodb://localhost:27017
          DATABASE_NAME=LibraryDb
          JWT_SECRET_KEY=ci-smoke-test-secret
          CAS_SERVER_URL=https://auth.example.com/cas
          EOL

      - name: Prepare storage directories
        run: mkdir -p storage/logs uploads

      - name: Start PHP built-in server
        run: php -S 127.0.0.1:8000 -t public &

      - name: Wait for server and verify it responds
        run: |
          attempt=0
          max_attempts=15
          until curl -sf http://127.0.0.1:8000/ -o /dev/null; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Server did not become available in time"
              cat storage/logs/php_errors.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          echo "Server responded successfully"
