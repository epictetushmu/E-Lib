name: E2E (Playwright)

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mbstring, mongodb

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          MONGO_URI=mongodb://127.0.0.1:27017
          JWT_SECRET_KEY=ci-test-jwt-secret-key-for-playwright-only
          APP_ENV=development
          CAS_SERVER_URL=https://auth.example.com/cas
          EOF

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8000 -t public &
          echo "Waiting for PHP server..."
          attempt=0
          max_attempts=30
          while ! curl -sf http://127.0.0.1:8000/ >/dev/null && [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt + 1))
            echo "waiting ($attempt/$max_attempts)..."
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/ >/dev/null

      - name: Run Playwright tests
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
