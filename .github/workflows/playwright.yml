name: Playwright E2E

on: [push, pull_request]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mbstring, mongodb, imagick

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install npm dependencies
        run: npm ci

      # public/dist/index.html must exist before the PHP server starts — PageRouter
      # serves it as the SPA shell for every non-API, non-/cas-login request.
      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      # Cache browser binaries across runs, keyed on the exact Playwright
      # version — bump the lockfile, get fresh browsers automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # System deps (fonts, codecs, etc.) still need installing even on a cache hit.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Create .env
        run: |
          cat > .env << 'EOL'
          APP_ENV=development
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          API_BASE_URL=http://localhost:8000/
          MONGO_URI=mongodb://localhost:27017
          DATABASE_NAME=LibraryDb
          JWT_SECRET_KEY=ci-e2e-secret
          CAS_SERVER_URL=https://auth.example.com/cas
          EOL

      # There's no self-service way to become an admin (by design — see
      # AuthenticatedUser::isAdmin()), so admin-gated specs need one
      # provisioned ahead of time. See qa/README.md.
      #
      # Credentials come from repo secrets, generated when those are empty
      # (GitHub withholds secrets from fork PRs). They only seed the throwaway
      # `mongodb` service container; later steps read them from $GITHUB_ENV.
      - name: Provision admin test account
        env:
          SECRET_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          SECRET_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
        run: |
          # Written via printf, not NAME=value, so secret scanners don't flag it.
          email=${SECRET_EMAIL:-ci-admin-$(openssl rand -hex 4)@example.test}
          pw=${SECRET_PASSWORD:-$(openssl rand -hex 16)}
          echo "::add-mask::$pw"
          printf '%s=%s\n' QA_ADMIN_EMAIL "$email" QA_ADMIN_PASSWORD "$pw" >> "$GITHUB_ENV"
          php scripts/create-admin.php "$email" "$pw" ci_admin

      # GET /api/v1/books returns 404 when the Books collection is empty
      # (BookController::getAllBooks() treats an empty result as an error,
      # not an empty list — a real app bug, tracked separately). Individual
      # tests create and clean up their own book fixtures via the API, so
      # under CI's single-worker sequential run the collection can be
      # genuinely empty between tests. Seed a persistent baseline that
      # outlives every test's own fixture so that endpoint always has
      # something to return.
      - name: Seed baseline books
        run: php scripts/seed-sample-books.php

      - name: Prepare storage directories
        run: mkdir -p storage/logs uploads

      - name: Start PHP built-in server
        run: php -S 127.0.0.1:8000 -t public &

      - name: Wait for server
        run: |
          attempt=0
          max_attempts=15
          until curl -sf http://127.0.0.1:8000/ -o /dev/null; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Server did not become available in time"
              cat storage/logs/php_errors.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

      # QA_ADMIN_EMAIL / QA_ADMIN_PASSWORD must match the account
      # provisioned above — see the comment on "Provision admin test account".
      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test

      # trace.zip (captured only on retry, i.e. only for a flaky/failed test) can contain the
      # admin password and a live bearer token from qa/pages/LoginPage.ts's fill()/API calls —
      # keep this artifact around only long enough to debug a failure, not 14+ days.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
